# Allocation and memory budgets (ADR 0009)
# Behaviour registry (ADR 0010). IDs are assigned once and never reused or renumbered; a withdrawn entry stays as status: retired.
# Initial population (TASK-2.3): every entry starts pending with an owning spec (ADR 0019). Fields are best-effort; the owning spec refines them.

- id: BUD-01
  title: "Uncontended Transact/ReadTransact with a static lambda allocates at most its recorded limit"
  source: "docs/adr/0009-allocation-and-memory-budgets.md:1"
  kind: y-sharp-own
  layers: [unit]
  wire: false
  owner: 14
  status: active
  ref: "adr 0009"
  note: "BUD-01..11 are the eleven named hot paths; BUD-12..14 are the other ADR 0009 budgets. active (TASK-4.12): bounded, not zero, by owner decision (option A): the body receives a fresh 24-byte Transaction over pooled state so a kept reference stays stale (CC-9). Measured 24 bytes per operation in Release for Transact and ReadTransact; limit 30 (plus 25%)."

