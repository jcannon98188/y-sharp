  layers: [unit]
  wire: false
  owner: 14
  status: active
  ref: "adr 0009"
  note: "Active at the release gate (TASK-4.44). Ceiling: the Yjs figure on the same workload (bench/yjs-memory/yjs-bytes-per-item.json, Yjs 13.6.33, Node 24); half of it is the goal. Measured in Release, each workload in its own process: text-insert 98.11 bytes per item (Yjs 194.77), array-push 8.08 (Yjs 8.31, 2.8% under the ceiling; owner sign-off 2026-10-26), map-set 156.86 (Yjs 312.26). MemoryTierTests green in the nightly job (run 40365311083); the nightly step summary prints the same table."

