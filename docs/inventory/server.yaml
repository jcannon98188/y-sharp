# Server tier (ADR 0024)
# Behaviour registry (ADR 0010). IDs are assigned once and never reused or renumbered; a withdrawn entry stays as status: retired.
# ADR 0019 has no server spec, so the server-tier entries are owned by spec 5, which owns the update functions the relay and the log build on
# (TASK-5.2 onward).

