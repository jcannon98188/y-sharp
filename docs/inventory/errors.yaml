- id: ERR-20
  title: "A violated internal invariant throws YInternalException and marks the document faulted: readable, but rejecting further mutation and apply"
  source: "docs/adr/0005-error-model-and-crash-safety.md:1"
  kind: y-sharp-own
  layers: [unit]
  wire: false
  owner: 11
  status: pending
  ref: "adr 0005 / Environment and internal faults"
  note: "Pending (owner: spec 11, then spec 12 for the seam): a document is faulted only by an internal invariant violation, which no public API input can cause by design (ERR-21 is asserted by the corpus and fuzz layers). The faulted-document behaviour (readable, rejects mutation and apply) therefore needs an internal fault-injection seam that the API stub lacks. ErrorModelTests.Err20 covers the exception family and the fresh-document state; the seam test lands with the implementation."

