name: release
# Packs YSharp, YSharp.Server and YSharp.Server.Testing on every push. A tag v<version> also runs the gating suite and, if it passes,
# publishes the packages and their symbols to nuget.org through trusted publishing: no stored API key (TASK-15, docs/releasing.md).
on:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version
        id: version
        run: |
          prefix=$(dotnet msbuild src/YSharp/YSharp.csproj -getProperty:VersionPrefix)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            # the tag must name the version in the source, so a release is reproducible from its commit
            case "$version" in
              "$prefix"|"$prefix"-*) ;;
              *) echo "::error::tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in src/Directory.Build.props"; exit 1 ;;
            esac
          else
            version="$prefix-ci.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packing $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Pack
        run: |
          for p in YSharp YSharp.Server YSharp.Server.Testing; do
            dotnet pack "src/$p/$p.csproj" -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}
          done
      - name: Install into a fresh project
        run: tools/package-smoke/smoke.sh artifacts ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error

  gating:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/gating.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack, gating]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the OIDC token nuget.org exchanges for a one-hour API key
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.pack.outputs.version }}
          path: artifacts
      - name: Check the nuget.org user is set
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: if [ -z "$NUGET_USER" ]; then echo "::error::the NUGET_USER secret (the nuget.org profile name) is not set"; exit 1; fi
      # trusted publishing: nuget.org checks this repository and workflow against its policy and returns a short-lived key
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # pushing a .nupkg also pushes the .snupkg next to it to the symbol server
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
