name: sharpfuzz
# Coverage-guided fuzzing (ADR 0013): SharpFuzz with AFL++, non-gating, nightly. A crash is minimised and then committed to the fixed
# corpus (tools/fixture-gen/scenarios/hostile-corpus.mjs); see tools/sharpfuzz/README.md. It never blocks a merge.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "AFL++ run time in seconds"
        default: "1200"
jobs:
  fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install AFL++
        run: sudo apt-get update && sudo apt-get install -y afl++
      - name: Install the SharpFuzz instrumenter
        run: dotnet tool install --global SharpFuzz.CommandLine
      # Two copies: fuzz-out is instrumented for AFL++, fuzz-replay is not. The instrumented YSharp.dll writes to AFL's coverage map, so
      # outside afl-fuzz (replay, minimise) it fails with an AccessViolationException before any input runs.
      - name: Build the harness and instrument YSharp.dll
        run: |
          dotnet build tools/sharpfuzz/YSharp.SharpFuzz.csproj -c Release -o fuzz-out
          cp -r fuzz-out fuzz-replay
          sharpfuzz fuzz-out/YSharp.dll
      - name: Seeds from the fixed corpus
        run: dotnet fuzz-replay/YSharp.SharpFuzz.dll --export-seeds fuzz-seeds
      - name: Fuzz
        env:
          AFL_SKIP_BIN_CHECK: "1"
          AFL_NO_AFFINITY: "1"
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
        run: |
          mkdir -p fuzz-findings
          timeout --preserve-status $(( ${{ github.event.inputs.seconds || '1200' }} + 120 )) \
            afl-fuzz -i fuzz-seeds -o fuzz-findings -t 5000 -m none -V ${{ github.event.inputs.seconds || '1200' }} -- dotnet fuzz-out/YSharp.SharpFuzz.dll
      # Artifact paths may not contain AFL's ':' and ',' so each finding is copied under a safe name, next to its minimised form and the
      # exception it raises on replay. The step summary lists every finding with the first line of that exception.
      - name: Replay and minimise findings
        if: always()
        run: |
          mkdir -p fuzz-upload
          echo "### SharpFuzz findings" >> "$GITHUB_STEP_SUMMARY"
          for f in fuzz-findings/default/crashes/id:* fuzz-findings/default/hangs/id:*; do
            [ -f "$f" ] || continue
            name="$(basename "$(dirname "$f")")-$(basename "$f" | cut -d, -f1 | tr ':' '_')"
            cp "$f" "fuzz-upload/$name.bin"
            timeout 60 dotnet fuzz-replay/YSharp.SharpFuzz.dll --replay "$f" > "fuzz-upload/$name.txt" 2>&1 || true
            timeout 600 dotnet fuzz-replay/YSharp.SharpFuzz.dll --minimise "$f" "fuzz-upload/$name.min.bin" >> "fuzz-upload/$name.txt" 2>&1 || true
            echo "- \`$name\`: $(grep -m1 -E 'Exception|exception' "fuzz-upload/$name.txt" || head -1 "fuzz-upload/$name.txt")" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sharpfuzz-findings
          path: fuzz-upload/
          if-no-files-found: ignore
