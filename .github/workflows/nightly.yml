name: nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the oracle server packages
        working-directory: tools/fixture-gen
        run: npm ci --no-audit --no-fund
      - run: dotnet build YSharp.slnx -c Release
      - name: Test (Nightly tier, slow differential, fuzz, soak, slow memory)
        env:
          YSHARP_TIER: Nightly
          YSHARP_REQUIRE_NODE: "1"
        run: dotnet test --solution YSharp.slnx -c Release --no-build --report-trx --results-directory TestResults
      # The SharpFuzz job is sharpfuzz.yml (TASK-2.11, non-gating). Benchmarks and their comparison are non-gating too (ADR 0009, TASK-2.14).
      - name: Restore last stored benchmark run
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.run_id }}
          restore-keys: bench-baseline-
      # A build failure of the benchmark project must surface (gating); only the run, compare and table steps below are non-gating.
      - name: Build benchmark project
        run: dotnet build bench/YSharp.Benchmarks -c Release
      - name: Benchmarks
        run: dotnet run -c Release --no-build --project bench/YSharp.Benchmarks -- --filter "*" --exporters json --artifacts bench-current
        continue-on-error: true
      - name: Compare benchmarks with the last stored run (reports regressions, never fails)
        run: |
          mkdir -p bench-current bench-baseline
          dotnet run -c Release --no-build --project bench/YSharp.Benchmarks -- compare bench-baseline bench-current --out bench-comparison.md | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Bytes-per-item table (y-sharp next to Yjs)
        run: dotnet run -c Release --no-build --project bench/YSharp.Benchmarks -- table | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Store this run as the next baseline
        run: |
          # Keep the previous baseline when this run produced no reports (for example while y-sharp is still the API stub).
          if [ -n "$(find bench-current -name '*-report*.json' 2>/dev/null)" ]; then
            rm -rf bench-baseline && mkdir -p bench-baseline
            find bench-current -name '*-report*.json' -exec cp {} bench-baseline/ \;
          fi
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results-and-failing-seeds
          path: |
            **/TestResults/*.trx
            **/failing-seeds/**
            TestResults/memory/**
            bench-comparison.md
            bench-current/**/*.json
          if-no-files-found: ignore
