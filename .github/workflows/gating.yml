name: gating
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gating:
    name: gating (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, config: Debug, coverage: true }
          - { os: ubuntu-latest, config: Release }
          - { os: windows-latest, config: Release }
          - { os: macos-latest, config: Release }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build YSharp.slnx -c ${{ matrix.config }}
      - name: Test (gating tier; Node is not installed)
        env:
          YSHARP_TIER: Gating
        run: dotnet test --solution YSharp.slnx -c ${{ matrix.config }} --no-build --report-trx --results-directory TestResults
      # The traceability check (ADR 0010) and the fixture version-header check (GeneratedFixtureTests) run inside the gating tests above; the matrix is uploaded below.
      # Coverage (ADR 0015): collected on the Linux gating run only, no threshold. A second pass keeps the gating run above free of the profiler.
      - name: Coverage (Linux gating run)
        if: matrix.coverage
        env:
          YSHARP_TIER: Gating
        run: dotnet test --solution YSharp.slnx -c ${{ matrix.config }} --no-build --coverage --coverage-output-format cobertura --results-directory TestResults/coverage
      - name: Coverage summary
        if: matrix.coverage && always()
        run: |
          {
            echo "### Coverage (gating tier, Linux, ${{ matrix.config }}; informational, no threshold)"
            echo
            echo "| Report | Line rate | Branch rate |"
            echo "|---|---|---|"
            for f in TestResults/coverage/*.cobertura.xml; do
              [ -e "$f" ] || continue
              line=$(grep -m1 -o ' line-rate="[0-9.]*"' "$f" | grep -o '[0-9.]*')
              branch=$(grep -m1 -o ' branch-rate="[0-9.]*"' "$f" | grep -o '[0-9.]*')
              echo "| $(basename "$f") | $(awk -v r="$line" 'BEGIN { printf "%.1f%%", r * 100 }') | $(awk -v r="$branch" 'BEGIN { printf "%.1f%%", r * 100 }') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.coverage && always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.config }}
          path: TestResults/coverage/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-matrix-${{ matrix.os }}-${{ matrix.config }}
          path: TestResults/traceability/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.config }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
